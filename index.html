<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qitchen — Japanese Restaurant</title>
  <meta name="description" content="Experience refined Japanese gastronomy at Qitchen. Artisanal sushi, authentic flavors, and contemporary elegance.">
  
  <!-- Favicon -->
  <link rel="icon" href="https://framerusercontent.com/images/SQZDQj2gDkUmN9upKjykPnd1NM.png">

  <!-- Google Fonts: Forum & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pure CSS Mobile/Drawer Toggle (No JS required) -->
  <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-hidden="true">

  <div class="page-wrapper">
    <!-- Semantic Header Landmark -->
    <header class="site-header">
      <div class="header-inner">
        <!-- Header Left: Menu Toggle + Brand Logo -->
        <div class="header-left">
          <label for="nav-toggle" class="nav-hamburger" aria-label="Toggle navigation menu" title="Open Menu">
            <span class="hamburger-line line-1"></span>
            <span class="hamburger-line line-2"></span>
            <span class="hamburger-line line-3"></span>
          </label>

          <a href="#hero" class="nav-brand" aria-label="Qitchen Homepage">
            <img src="assets/images/logo.webp" alt="Qitchen" class="brand-logo" width="130" height="35">
          </a>
        </div>

        <!-- Header Right: Semantic Navigation Landmark -->
        <nav class="site-nav" aria-label="Main Navigation">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#menu" class="nav-link">Menu</a>
            </li>
            <li class="nav-item">
              <a href="#about" class="nav-link">About</a>
            </li>
            <li class="nav-item">
              <a href="#reservation" class="nav-btn-book">Book a Table</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Navigation Drawer Overlay (Pure CSS Activated) -->
    <div class="nav-drawer-overlay">
      <label for="nav-toggle" class="drawer-backdrop" aria-label="Close navigation overlay"></label>
      <aside class="nav-drawer" aria-label="Extended site navigation">
        <div class="drawer-header">
          <a href="#hero" class="drawer-brand">
            <img src="assets/images/logo.webp" alt="Qitchen" class="drawer-logo" width="120" height="32">
          </a>
          <label for="nav-toggle" class="drawer-close-btn" aria-label="Close navigation menu" title="Close Menu">&times;</label>
        </div>

        <div class="drawer-body">
          <div class="drawer-section">
            <span class="drawer-label">Menu</span>
            <ul class="drawer-nav-list">
              <li>
                <label for="nav-toggle"><a href="#hero" class="drawer-nav-link">Home</a></label>
              </li>
              <li>
                <label for="nav-toggle"><a href="#menu" class="drawer-nav-link">Menu</a></label>
              </li>
              <li>
                <label for="nav-toggle"><a href="#about" class="drawer-nav-link">About Us</a></label>
              </li>
              <li>
                <label for="nav-toggle"><a href="#reservation" class="drawer-nav-link">Reservation</a></label>
              </li>
              <li>
                <label for="nav-toggle"><a href="#contact" class="drawer-nav-link">Contact</a></label>
              </li>
            </ul>
          </div>

          <!-- Grid Usage: Drawer Information Cards -->
          <div class="drawer-info-grid">
            <div class="drawer-info-card">
              <h3 class="info-title">Opening Hours</h3>
              <p class="info-text">Mon – Fri: 16:00 – 22:30</p>
              <p class="info-text">Sat & Sun: 12:00 – 23:00</p>
            </div>

            <div class="drawer-info-card">
              <h3 class="info-title">Address</h3>
              <p class="info-text">Václavská 45</p>
              <p class="info-text">110 00 Praha, Czechia</p>
            </div>

            <div class="drawer-info-card">
              <h3 class="info-title">Contact</h3>
              <p class="info-text"><a href="tel:+420123456789">+420 123 456 789</a></p>
              <p class="info-text"><a href="mailto:info@qitchen.com">info@qitchen.com</a></p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Main Content Landmark -->
    <main id="main-content">
      <!-- Hero Section -->
      <section class="hero-section" id="hero" aria-label="Hero">
        <div class="hero-media-container">
          <!-- Background Video -->
          <video class="hero-video" autoplay loop muted playsinline poster="">
            <source src="assets/videos/hero-bg.mp4" type="video/mp4">
            <source src="https://framerusercontent.com/assets/KNjmnFp5kwda6KegO13wieYyI0.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          
          <!-- Cinematic Overlay for contrast and mood -->
          <div class="hero-overlay"></div>
          
          <!-- Hero Inner Elements -->
          <div class="hero-inner">
            <div class="hero-bottom-bar">
              <!-- Single H1 Landmark for the entire document -->
              <h1 class="hero-title">
                <span class="title-line">SUSHI</span>
                <span class="title-line">SENSATION</span>
              </h1>

              <!-- Bottom Right Badges / Social Icons -->
              <div class="hero-badges" aria-label="Featured links and accolades">
                <a href="#about" class="badge-icon-btn" aria-label="TripAdvisor" title="TripAdvisor">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="8.5" cy="10.5" r="2.5"></circle>
                    <circle cx="15.5" cy="10.5" r="2.5"></circle>
                    <path d="M12 12v3"></path>
                    <path d="M7 6.5C8.5 5.5 10 5 12 5s3.5.5 5 1.5"></path>
                  </svg>
                </a>
                <a href="#about" class="badge-icon-btn" aria-label="Instagram" title="Instagram">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                  </svg>
                </a>
                <a href="#about" class="badge-icon-btn" aria-label="Michelin Guide" title="Michelin Guide">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
