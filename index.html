<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qitchen — Japanese Restaurant</title>
  <meta name="description" content="Experience refined Japanese gastronomy at Qitchen. Artisanal sushi, authentic flavors, and contemporary elegance.">
  
  <!-- Google Fonts: Forum & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Main Content Landmark -->
    <main id="main-content">
      <!-- Hero Section -->
      <section class="hero-section" id="hero" aria-label="Hero">
        <div class="hero-media-container">
          <!-- Background Video -->
          <video class="hero-video" autoplay loop muted playsinline poster="">
            <source src="assets/videos/hero-bg.mp4" type="video/mp4">
            <source src="https://framerusercontent.com/assets/KNjmnFp5kwda6KegO13wieYyI0.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          
          <!-- Cinematic Overlay for contrast and mood -->
          <div class="hero-overlay"></div>
          
          <!-- Hero Inner Elements -->
          <div class="hero-inner">
            <div class="hero-bottom-bar">
              <!-- Single H1 Landmark for the entire document -->
              <h1 class="hero-title">
                <span class="title-line">SUSHI</span>
                <span class="title-line">SENSATION</span>
              </h1>

              <!-- Bottom Right Badges / Social Icons -->
              <div class="hero-badges" aria-label="Featured links and accolades">
                <a href="#about" class="badge-icon-btn" aria-label="TripAdvisor" title="TripAdvisor">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="8.5" cy="10.5" r="2.5"></circle>
                    <circle cx="15.5" cy="10.5" r="2.5"></circle>
                    <path d="M12 12v3"></path>
                    <path d="M7 6.5C8.5 5.5 10 5 12 5s3.5.5 5 1.5"></path>
                  </svg>
                </a>
                <a href="#about" class="badge-icon-btn" aria-label="Instagram" title="Instagram">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                  </svg>
                </a>
                <a href="#about" class="badge-icon-btn" aria-label="Michelin Guide" title="Michelin Guide">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
